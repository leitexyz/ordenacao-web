<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Heap Sort Animado</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
    }

    .container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 300px;
      margin-top: 20px;
      gap: 5px;
    }

    .bar {
      width: 40px;
      background: steelblue;
      color: white;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: 0.3s;
    }

    .active {
      background: orange !important;
    }

    .sorted {
      background: green !important;
    }
  </style>
</head>

<body>

<h2>Heap Sort Animado</h2>

<button onclick="start()">Iniciar</button>

<div class="container" id="container"></div>

<script>
let array = [4, 10, 3, 5, 1];
let container = document.getElementById("container");

function render(arr, active = [], sorted = []) {
  container.innerHTML = "";

  arr.forEach((value, i) => {
    let div = document.createElement("div");
    div.classList.add("bar");

    if (active.includes(i)) div.classList.add("active");
    if (sorted.includes(i)) div.classList.add("sorted");

    div.style.height = value * 20 + "px";
    div.innerText = value;

    container.appendChild(div);
  });
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function heapify(arr, n, i, sorted) {
  let maior = i;
  let esquerda = 2 * i + 1;
  let direita = 2 * i + 2;

  render(arr, [i], sorted);
  await sleep(500);

  if (esquerda < n && arr[esquerda] > arr[maior]) {
    maior = esquerda;
  }

  if (direita < n && arr[direita] > arr[maior]) {
    maior = direita;
  }

  if (maior !== i) {
    [arr[i], arr[maior]] = [arr[maior], arr[i]];
    render(arr, [i, maior], sorted);
    await sleep(500);

    await heapify(arr, n, maior, sorted);
  }
}

async function heapSort(arr) {
  let n = arr.length;
  let sorted = [];

  for (let i = Math.floor(n / 2 - 1); i >= 0; i--) {
    await heapify(arr, n, i, sorted);
  }

  for (let i = n - 1; i > 0; i--) {
    [arr[0], arr[i]] = [arr[i], arr[0]];
    sorted.push(i);

    render(arr, [0, i], sorted);
    await sleep(600);

    await heapify(arr, i, 0, sorted);
  }

  sorted.push(0);
  render(arr, [], sorted);
}

function start() {
  heapSort([...array]);
}

// inicial
render(array);
</script>

</body>
</html>
